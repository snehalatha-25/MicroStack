apiVersion: apps/v1
kind: Deployment
metadata: { name: cart-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: cart-service } }
  template:
    metadata: { labels: { app: cart-service } }
    spec:
      containers:
        - name: cart-service
          image: YOUR_DOCKERHUB_USERNAME/microstack-cart:1.0
          ports: [{ containerPort: 8082 }]
