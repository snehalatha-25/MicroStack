apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
        - name: order-service
          image: YOUR_DOCKERHUB_USERNAME/microstack-order:1.0
          ports: [{ containerPort: 8083 }]
