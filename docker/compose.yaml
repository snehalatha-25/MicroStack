
services:
  product-service:
    build: ../backend/product-service
    ports:
      - "8081:8080"

  cart-service:
    build: ../backend/cart-service
    ports:
      - "8082:8082"

  order-service:
    build: ../backend/order-service
    ports:
      - "8083:8083"

  frontend:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - product-service
      - cart-service
      - order-service
