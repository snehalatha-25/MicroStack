server {
    listen 80;
    server_name _;

    location /api/products {
        proxy_pass http://product-service:8080/api/products;
    }

    location /api/cart {
        proxy_pass http://cart-service:8082/api/cart;
    }

    location /api/orders {
        proxy_pass http://order-service:8083/api/orders;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
